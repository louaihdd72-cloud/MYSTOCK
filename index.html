<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>Stock</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--pr:#0f766e;--dg:#dc2626;--wn:#d97706;--gn:#16a34a;--bd:#e3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#8b97a4;--pr:#2dd4bf;--gn:#4ade80;--bd:#2a3541}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#8b97a4;--pr:#2dd4bf;--gn:#4ade80;--bd:#2a3541}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
header{padding:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{margin:0;font-size:19px}h3{margin:16px 0 6px;font-size:15px}
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ib{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:15px;color:var(--tx);margin-inline-start:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:17px;color:var(--pr)}.st span{font-size:11px;color:var(--mu)}
.st.g b{color:var(--gn)}.st.w{grid-column:1/-1;cursor:pointer}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
#list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.it.low{border-color:var(--wn)}.it.zero{border-color:var(--dg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:700;font-size:16px}
.pc{color:var(--mu);font-size:13px;margin-top:4px;line-height:1.7}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;float:inline-start;margin-inline-end:10px;background:var(--bg);border:1px solid var(--bd)}
.th.ph{display:flex;align-items:center;justify-content:center;font-size:22px;opacity:.6}
.inf{display:flow-root}
.ep{border-bottom:1px dashed var(--mu)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.q{display:flex;align-items:center;gap:6px}
.q button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:22px}
.q span{min-width:38px;text-align:center;font-size:18px;font-weight:700;border-bottom:1px dashed var(--mu)}
.sell{background:var(--gn);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700}
.ft{margin-top:8px;font-size:12px;color:var(--mu);display:flex;justify-content:space-between;gap:6px}
.ic{background:none;border:0;font-size:18px;padding:6px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;background:var(--pr);color:#fff;border:0;border-radius:28px;padding:14px 22px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:10}
.ovl.on{display:flex}
.sh{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sh h2{margin:0 0 8px;font-size:18px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pv{margin-top:12px;text-align:center;font-weight:700;color:var(--gn)}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{flex:1;padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:700}
.sv{background:var(--pr);color:#fff}.cn{background:var(--bg);color:var(--tx)}.wd{background:var(--dg);color:#fff}
.pick{display:flex;align-items:center;gap:10px}.pick .th{float:none;margin:0;flex:none}
.pb{display:inline-block;margin:0;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:14px}
.rm{background:none;border:0;color:var(--dg);font-size:14px;padding:6px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tx small{color:var(--mu)}
.bal{font-size:30px;font-weight:800;text-align:center;color:var(--pr);margin:6px 0 4px}
#lk{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.lb{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.lb button{padding:13px;border-radius:10px;border:0;font-size:16px;font-weight:700}
.er{color:var(--dg);min-height:18px;font-size:14px}.mu{color:var(--mu);font-size:14px;margin:0}
.br{font-size:12px;color:var(--pr);font-weight:700}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.nav button{flex:none;white-space:nowrap;margin:0}.nav i{font-style:normal}
.x{opacity:.5;text-decoration:line-through}
.logo{height:46px;width:auto;border-radius:8px;display:block}
.it.sel{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr)}
.cols{margin-top:10px;background:var(--bg);border-radius:10px;padding:8px}
.cols table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}.cols th{color:var(--mu);font-weight:600;padding:2px}.cols td{padding:2px}.cols input,.cols select{padding:8px;font-size:15px}
#cb{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:6;align-items:center;justify-content:space-between}
#cb button{padding:12px 16px;border-radius:10px;border:0;font-size:15px;font-weight:700}
.nav .on{background:var(--pr);color:#fff}
.nb{background:var(--dg);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-inline-start:4px}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;background:#fff;padding:12px}#pa table{width:100%;border-collapse:collapse}#pa th,#pa td{border-bottom:1px solid #ccc;padding:6px;text-align:start}#pa .ph{display:flex;gap:12px;align-items:center}#pa img{height:60px}}
.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-size:15px;margin:10px 0}.ck input{width:auto}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:15px}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.tabs i,.chips i{font-style:normal}
.pad{padding:0 16px 10px}.chips{display:flex;gap:6px;margin-top:8px}.chips button{padding:6px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}.chips .on{background:var(--pr);color:#fff;border-color:var(--pr)}
#vh{padding:0 16px}.sec{margin:14px 0 8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}.seg .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.ic2{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.ic2.x{opacity:.55}.ih{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px}.ih b{color:var(--pr);font-size:15px}
.cn2{margin:6px 0;font-weight:700}.cn2 small{color:var(--mu);font-weight:400}
.il{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-top:1px dashed var(--bd)}.il span:first-child{flex:1}.il.x{text-decoration:line-through}
.it2{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:16px}
.bdg{background:var(--dg);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
.ia{display:flex;justify-content:flex-end;gap:2px;margin-top:4px}
.lowp{color:var(--dg)!important;font-weight:700;border-color:var(--dg)!important}
</style>
